# jms workflow live

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - zeelsh-dev

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - zeelsh-dev

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_STONE_093BDDF0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          action: "upload"

          # React + Vite configuration
          app_location: "/"
          api_location: ""
          output_location: "dist"

          app_build_command: "npm install && npm run build"
        env:
            VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_LIVE_RECRUIT_OS }}
            VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL_LIVE_RECRUIT_OS }}
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_STONE_093BDDF0F }}
          action: "close"